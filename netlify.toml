[build]
  publish = "public"

[[edge_functions]]
  path = "/api/ask-finn"
  function = "ask-finn"

[[edge_functions]]
  path = "/api/subscribe"
  function = "subscribe"

[[edge_functions]]
  path = "/api/snapshot-session"
  function = "snapshot-session"

# TEMPORARY (step 2): token-gated account creation standing in for the
# Stripe "payment succeeded" event. Step 4 replaces the gate with real
# Stripe verification.
[[edge_functions]]
  path = "/api/create-account"
  function = "create-account"

# Clarity Session conversation (3a). JWT-gated to clarity-depth members;
# system prompt lives server-side in the function.
[[edge_functions]]
  path = "/api/clarity-chat"
  function = "clarity-chat"

# CSV transaction import: deterministic parse/summarise for living costs.
# Same JWT gate; read-and-discard, nothing stored.
[[edge_functions]]
  path = "/api/import-transactions"
  function = "import-transactions"

# Conduct linter reports (capture-conduct step 6). Same JWT gate; reads
# and runs the per-session conduct report for the member's household.
[[edge_functions]]
  path = "/api/conduct-report"
  function = "conduct-report"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-XSS-Protection = "1; mode=block"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/snapshot/result/*"
  to = "/snapshot/result/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
