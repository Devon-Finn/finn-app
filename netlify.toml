[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  timeout = 30

[[edge_functions]]
  path = "/api/ask-finn"
  function = "ask-finn"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
