<!doctype html>
<meta charset="utf-8">
<title>Finn suites</title>
<!-- The no-node fallback. Needs a static server rooted at the repo: the
     suites are ES modules and module imports are blocked on file://.
     See tests/README.md. Results also land in window.__FINN_RESULTS__ so a
     headless driver can read them without scraping the page. -->
<body style="font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;margin:24px">
<script type="module">
// Shims for what the edge and browser runtimes provide. Neither is touched
// by any path under test: clarity-chat reads Deno.env only inside handler().
if (typeof globalThis.Deno === 'undefined') globalThis.Deno = { env: { get: () => undefined } };

const S = '/public/app/shared/';
const L = '/netlify/edge-functions/lib/';
const out = { suites: [], error: null };
const log = m => { const d = document.createElement('div'); d.textContent = m; document.body.appendChild(d); };

// The browser-side files are classic scripts that assign to window.
const loadClassic = async (file) => {
  const src = await (await fetch(S + file)).text();
  (0, eval)(src);
};

try {
  const registry = await import(L + 'finn-field-registry.js');
  const paths    = await import(L + 'finn-retrieval-paths.js');
  const merge    = await import(L + 'finn-merge.js');
  const linter   = await import(L + 'finn-conduct-linter.js');
  const planMod  = await import(L + 'finn-plan.js');
  const tokens   = await import(L + 'finn-tokens.js');
  const pipeline = await import(L + 'finn-capture-pipeline.js');
  // One implementation, two importers: importing it also sets
  // window.finnDerived for the classic scripts below.
  const derived  = await import(S + 'finn-derived.js');
  const chat     = await import('/netlify/edge-functions/clarity-chat.js');

  await loadClassic('finn-components.js');
  await loadClassic('finn-triggers.js');
  await loadClassic('finn-panels.js');
  await loadClassic('finn-fixtures.js');

  const library = await (await fetch(S + 'finn-library.json')).json();

  const gateT   = await import('./finn-gate.tests.js');
  const planT   = await import('./finn-plan.tests.js');
  const fixT    = await import('./finn-fixture-household.tests.js');
  const streamT = await import('./finn-stream.tests.js');

  const SUITES = [
    ['runGateTests',           44,  () => gateT.runGateTests(registry)],
    ['runPathTests',           13,  () => gateT.runPathTests(registry, paths)],
    ['runLinterTests',         16,  () => gateT.runLinterTests(registry, paths, linter, planMod)],
    ['runMergeTests',          12,  () => gateT.runMergeTests(merge)],
    ['runFixtureHousehold',   163,  () => fixT.runFixtureHousehold({
      pipeline, registry, paths, linter,
      derive: derived.derive,
      evaluate: window.finnTriggers.evaluate,
      panels: window.finnPanels,
      library, plan: planMod, chat,
      browserDerive: window.finnDerived && window.finnDerived.derive,
    })],
    ['runFinnTriggerFixtures', 16,  () => window.runFinnTriggerFixtures()],
    ['runPlanTests',          105,  () => planT.runPlanTests({ plan: planMod, pipeline, tokens })],
    ['runStreamTests',         44,  () => streamT.runStreamTests(chat, tokens)],
  ];

  for (const [name, expected, fn] of SUITES) {
    let r;
    try { r = await fn(); }
    catch (e) { r = { pass: false, total: null, declared: null, failures: ['CRASHED: ' + (e && (e.stack || e.message))] }; }
    const rec = {
      name, expected, counted: r.total,
      declared: r.declared === undefined ? null : r.declared,
      pass: !!r.pass, failures: r.failures || [],
    };
    rec.countOk = rec.counted === expected;
    rec.declaredMatchesCounted = rec.declared === null ? null : rec.declared === rec.counted;
    out.suites.push(rec);
    log(name.padEnd(26) + ' counted=' + rec.counted + ' declared=' + rec.declared + ' expected=' + expected +
        (rec.pass ? '' : '  FAIL') +
        (rec.countOk ? '' : '  *** COUNTED != EXPECTED ***') +
        (rec.declaredMatchesCounted === false ? '  *** DECLARED != COUNTED ***' : ''));
    for (const f of rec.failures) log('    - ' + String(f).slice(0, 400));
  }
} catch (e) {
  out.error = (e && (e.stack || e.message)) || String(e);
  log('RUNNER ERROR: ' + out.error);
}

out.countedTotal = out.suites.reduce((a, s) => a + (s.counted || 0), 0);
out.allPass = !out.error && out.suites.length === 8 && out.suites.every(s => s.pass && s.countOk);
out.declaredFindings = out.suites.filter(s => s.declaredMatchesCounted === false)
  .map(s => ({ suite: s.name, declared: s.declared, counted: s.counted, delta: s.counted - s.declared }));
window.__FINN_RESULTS__ = out;
log('\ncounted total: ' + out.countedTotal);
for (const f of out.declaredFindings) {
  log('FINDING: ' + f.suite + ' declares ' + f.declared + ' but ran ' + f.counted +
      ' (' + (f.delta > 0 ? '+' : '') + f.delta + '). Resolve it; do not pad to the declared number.');
}
document.title = (out.allPass ? 'ALL PASS' : 'FAILURES') +
  (out.declaredFindings.length ? ' + ' + out.declaredFindings.length + ' DECLARED-COUNT FINDINGS' : '');
log('\n' + document.title);
</script>
