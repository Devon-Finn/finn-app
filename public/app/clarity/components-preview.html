<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finn component gallery (fixtures only)</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Fraunces:ital,opsz,wght@1,9..144,400;1,9..144,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app/shared/finn-components.css">
<!-- Step 2 review harness: every component in component-spec Parts Two and
     Three, rendered once with fixture or library data. FIXTURE DATA ONLY.
     No auth, no data calls beyond the static library file.
     Remove before merge, with panels-preview.html. -->
<style>
  :root{
    --parch:#f6f2ec; --canvas:#e7e0d3; --surface:#ffffff;
    --dark:#1c1917; --mid:#5c5a55; --light:#9a9a94; --rule:#e6e0d6; --rule-soft:#efeae1;
    --accent:#2a4a3a; --accent-deep:#213b2e; --accent-light:#f0f4f1;
    --steel:#c2d4de; --warm:#c4956a; --warm-deep:#a8703f; --warm-light:#fdf6ee;
    --shadow:0 1px 2px rgba(28,25,23,.04), 0 8px 24px rgba(28,25,23,.05);
  }
  body { font-family: 'Jost', sans-serif; font-weight: 500; background: var(--canvas); color: var(--dark); margin: 0; padding: 28px 16px 80px; }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .note { color: var(--mid); font-size: 13px; margin-bottom: 26px; }
  section { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 18px 20px; margin-bottom: 18px; }
  section > h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--mid); margin: 0 0 12px; }
</style>
</head>
<body>
<div class="wrap fc" id="out">
  <h1>Component gallery</h1>
  <div class="note">Every component from component-spec Parts Two and Three, once. Fixture data only. Nothing here is a real household.</div>
</div>
<script src="/app/shared/finn-components.js"></script>
<script src="/app/shared/finn-terms.js"></script>
<script>
(async function () {
  const C = window.finnComponents;
  const library = await (await fetch('/app/shared/finn-library.json')).json();
  const out = document.getElementById('out');
  const sect = (title, html) => { const s = document.createElement('section'); s.innerHTML = '<h2>' + title + '</h2>' + html; out.appendChild(s); return s; };

  // 2.1 Calc block — the spec's own worked example.
  sect('2.1 · Calc block', C.calcBlock([
    { label: 'Value, your estimate', op: '', value: '$850,000' },
    { label: 'Loan balance', op: '−', value: '$512,000' },
    { label: 'What you own of it', op: '=', value: '$338,000', result: true },
  ]));

  // 2.1 with a missing value — never $0.
  sect('2.1 · Calc block, missing input', C.calcBlock([
    { label: 'Value, your estimate', op: '', value: '$850,000' },
    { label: 'Loan balance', op: '−', value: '', missing: true },
    { label: 'What you own of it', op: '=', value: '', missing: true, result: true },
  ]));

  // 2.2 Handover line — spec example.
  sect('2.2 · Handover line', C.handoverLine('Lenders and brokers call this your <term id="lvr">LVR</term>, for loan to value ratio. They change the terms they\'ll offer at certain levels of it.'));

  // 2.3 Term affordance + first-encounter handover (in-memory handed state
  // for the demo; the real page persists against the household).
  const termsData = await (await fetch('/app/shared/finn-terms.json')).json();
  window.finnTerms.init({ terms: termsData.terms, handed: {}, onHandover: null });
  const termSect = sect('2.3 · Term affordance: first encounter hands over, second renders bare',
    C.eduBlock(null, 'Your <term id="equity">equity</term> grows every time you make a repayment.') +
    C.eduBlock(null, 'Using <term id="equity">equity</term> changes your <term id="lvr">LVR</term>, and lenders look at that number first.'));
  window.finnTerms.processContainer(termSect);

  // 2.4 Proportion bar.
  sect('2.4 · Proportion bar', C.proportionBar(
    { label: 'Owed $512,000', value: 512000 },
    { label: 'Yours $338,000', value: 338000 },
    'Loan $512,000 against equity $338,000'));

  // 2.5 Reference block.
  sect('2.5 · Reference block', C.referenceBlock('The rest of the loan details', 3,
    C.calcBlock([
      { label: 'Rate type', op: '', value: '', missing: true },
      { label: 'Lender', op: '', value: '', missing: true },
      { label: 'Term remaining', op: '', value: '', missing: true },
    ])));

  // 2.6 Cost pill and line (from the professionals registry).
  const broker = library.professionals.mortgage_broker;
  sect('2.6 · Cost pill and line', C.costPill(broker.cost_pill) + ' ' + C.costLine(broker.cost_line));

  // 3.1 Figure hero (+ bar).
  sect('3.1 · Figure hero', C.figureHero('$338,000', 'is the part of the property you own', 'outright.',
    C.proportionBar({ label: 'Owed $512,000', value: 512000 }, { label: 'Yours $338,000', value: 338000 }, 'Loan $512,000 against equity $338,000')));

  // 3.2 Gap card — real 1.1 entry from the library, body assembled per spec order.
  const i11 = library.insights.find(e => e.id === '1.1');
  const gapBody =
    C.eduBlock('Why this is worth a conversation', i11.blocks.why) +
    C.eduBlock('What a look at this can turn up', i11.blocks.turn_up) +
    C.eduBlock("The part most people don't realise", i11.blocks.dont_realise, true) +
    C.eduBlock('How the professional works', i11.blocks.how_professional) +
    '<div style="margin-top:12px">' + C.costPill(broker.cost_pill) + ' ' + C.costLine(broker.cost_line) + '</div>' +
    C.promiseBlock(C.renderCopyInline(i11.blocks.nothing_to_prepare)) +
    C.actionZone(i11.action_label, 'Nobody buys their way onto the list. We meet everyone first.');
  sect('3.2 · Gap card (collapsed by default; click it)', C.gapCard({
    id: '1.1',
    headline: 'Your rate and how the loan is set up',
    hook: "Your loan is at 6.34% (variable), and you've been with your lender since 2019.",
    chip: 'Mortgage broker · usually free',
    bodyHtml: gapBody,
  }));

  // 3.3 Step rail — two cards.
  sect('3.3 · Step rail (2+ insights)', C.stepRail([
    C.gapCard({ id: '1.1', headline: 'Your rate and how the loan is set up', chip: 'Mortgage broker · usually free', bodyHtml: '<p>…</p>' }),
    C.gapCard({ id: '1.3', headline: 'Your equity and what it could be used for', chip: 'Find the right professional', bodyHtml: '<p>…</p>' }),
  ]));
  sect('3.3 · Single insight: bare, unnumbered', C.stepRail([
    C.gapCard({ id: '6.1', headline: 'Your will and the legal basics', chip: 'Estate planning lawyer · fixed price', bodyHtml: '<p>…</p>' }),
  ]));

  // 3.4 Promise block.
  sect('3.4 · Promise block', C.promiseBlock("<b>There's nothing you need to prepare.</b> Finn sends your whole picture ahead, so you're not sitting there trying to explain a situation you've never had laid out before."));

  // 3.5 Action zone.
  sect('3.5 · Action zone', C.actionZone('Find a mortgage broker', 'Nobody buys their way onto the list. We meet everyone first.'));

  // 3.6 Calm block — Tile 9, the one written.
  sect('3.6 · Calm block (Tile 9)', C.calmBlock(library.tiles['9'].calm));

  // 3.7 Repeating items + aggregate — spec's two-property example.
  sect('3.7 · Repeating item cards and aggregate', C.repeatingItems([
    { title: 'Ferntree Gully', rows: [
      { label: 'Value, your estimate', op: '', value: '$640,000' },
      { label: 'Loan against it', op: '−', value: '$410,000' },
      { label: 'Equity', op: '=', value: '$230,000', result: true } ] },
    { title: 'Belgrave', rows: [
      { label: 'Value, your estimate', op: '', value: '$520,000' },
      { label: 'Loan against it', op: '−', value: '$300,000' },
      { label: 'Equity', op: '=', value: '$220,000', result: true } ] },
  ], [
    { label: 'Total value', op: '', value: '$1,160,000' },
    { label: 'Total lending', op: '−', value: '$710,000' },
    { label: 'Total equity', op: '=', value: '$450,000', result: true },
  ]));

  // 3.8 Professional card.
  sect('3.8 · Professional card', C.professionalCard({
    name: broker.name, role: broker.role, count: 2,
    itemsHtml: C.professionalItem('Your rate and how the loan is set up') +
      C.professionalItem('Your equity and what it could be used for', ['Financial planner']),
    cost_pill: broker.cost_pill, cost_line: broker.cost_line,
    actionHtml: C.actionZone('Find a mortgage broker'),
  }));

  // 3.9 Trust banner — disclosure inside the trust claim, first.
  sect('3.9 · Trust banner', C.trustBanner(
    '<b>Finn is paid by the professionals on our list.</b> What they can\'t do is buy their way onto it. We meet everyone first, and if we wouldn\'t send our own family to them, they\'re not there. <span class="steel">Whoever you see, you turn up understood.</span>'));
})();
</script>
</body>
</html>
