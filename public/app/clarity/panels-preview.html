<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finn — panel preview (fixtures only)</title>
<!-- Step 5 review harness. Renders the trigger-engine fixtures through the
     panel components. FIXTURE DATA ONLY — no real household data is loaded
     or loadable here; there is no auth and no Supabase call on this page.
     Remove before merge if preferred. -->
<style>
  body { font: 15px/1.55 -apple-system, "Segoe UI", system-ui, sans-serif; color: #1e2430; background: #f7f6f3; margin: 0; padding: 24px; }
  .bar { max-width: 720px; margin: 0 auto 20px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .bar select { font: inherit; padding: 6px 10px; }
  .bar .note { color: #66707f; font-size: 13px; }
  .fp-dashboard { max-width: 720px; margin: 0 auto; display: grid; gap: 18px; }
  .fp-tile { background: #fff; border: 1px solid #e4e1da; border-radius: 10px; padding: 20px 22px; }
  .fp-tile h3 { margin: 0 0 12px; font-size: 17px; }
  .fp-tile h4 { margin: 18px 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: #66707f; }
  .fp-tile h5 { margin: 14px 0 4px; font-size: 14px; }
  .fp-row { display: flex; justify-content: space-between; gap: 16px; padding: 5px 0; border-bottom: 1px dashed #eeece7; }
  .fp-row .fp-label { color: #66707f; }
  .fp-row .fp-value { text-align: right; }
  .fp-insight { border-top: 1px solid #e4e1da; margin-top: 14px; padding-top: 12px; }
  .fp-position { font-weight: 600; }
  .fp-intro { font-style: italic; }
  .fp-action { font-weight: 600; margin-bottom: 0; }
  .fp-b p, .fp-block p { margin: 6px 0; }
</style>
</head>
<body>
<div class="bar">
  <label for="fx">Fixture:</label>
  <select id="fx"></select>
  <span class="note">Fixture data only — nothing here is a real household.</span>
</div>
<div id="out"></div>
<script src="/app/shared/finn-derived.js"></script>
<script src="/app/shared/finn-triggers.js"></script>
<script src="/app/shared/finn-fixtures.js"></script>
<script src="/app/shared/finn-panels.js"></script>
<script>
(async function () {
  const library = await (await fetch('/app/shared/finn-library.json')).json();
  const fixtures = window.FINN_TRIGGER_FIXTURES;
  const sel = document.getElementById('fx');
  fixtures.forEach((fx, i) => {
    const opt = document.createElement('option');
    opt.value = i; opt.textContent = fx.name;
    sel.appendChild(opt);
  });
  function render() {
    const fx = fixtures[Number(sel.value)];
    document.getElementById('out').innerHTML =
      window.finnPanels.renderDashboard(fx.domains, { yearNow: 2026, library });
  }
  sel.addEventListener('change', render);
  render();
})();
</script>
</body>
</html>
